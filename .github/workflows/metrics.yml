name: Metrics
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN: personal access token with read access to private repos, so Kata is counted
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics.svg
          template: classic
          base: activity, community, repositories
          config_timezone: America/Toronto
          plugin_languages: yes
          plugin_languages_limit: 6
