name: Metrics
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN: personal access token with read access to private repos, so Kata is counted
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics.svg
          template: classic
          # community/repositories dropped: mostly zeros, which reads worse than nothing
          base: activity
          config_timezone: America/Toronto
          # extra bottom room: GitHub renders text taller than the headless browser that measures it
          config_padding: 0, 8 + 20%
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      # publish to a separate branch so daily updates don't clutter main's history
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
